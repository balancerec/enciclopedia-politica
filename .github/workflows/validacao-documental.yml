name: Validação documental
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar estrutura
        run: python scripts/validar_catalogo.py

      - name: Validar rastreabilidade da pesquisa
        run: python scripts/validar_pesquisa.py

      - name: Validar links e notas do vault Obsidian
        run: python scripts/validar_obsidian.py
